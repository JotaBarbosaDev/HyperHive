name: Build Web (Expo)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional app version to build (for example 1.0.2)
        required: false
        type: string
  push:
    tags:
      - 'web-v*'          # opcional: corre quando fizeres tag tipo web-v1.0.0

jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set or validate app version
        env:
          HH_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$HH_VERSION" ]; then
            npm run version:set -- "$HH_VERSION"
          elif [[ "$GITHUB_REF_NAME" == web-v* ]]; then
            npm run version:set -- "${GITHUB_REF_NAME#web-v}"
          else
            npm run version:check
          fi

      - name: Install JS deps
        run: npm ci

      - name: Build web bundle (Expo)
        # Gera ficheiros estáticos para web
        run: |
          npx expo export --platform web --output-dir dist

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
